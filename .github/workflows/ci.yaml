name: Continuous integration

on:
 push:
   branches:
     - 'main'
   paths:
     - '**/*.go'
     - 'go.mod'
     - 'go.sum'
     - '.golangci.yaml'
     - '.goreleaser.yml'
     - 'Taskfile.yml'
     - 'aqua.yaml'
     - .github/workflows/**

 pull_request:
   paths:
     - '**/*.go'
     - 'go.mod'
     - 'go.sum'
     - '.golangci.yaml'
     - '.goreleaser.yml'
     - 'Taskfile.yml'
     - 'aqua.yaml'
     - .github/workflows/**

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run GoLangCI-Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

      - name: Build 
        run: go build

      - name: Test
        run: go test -v ./...
